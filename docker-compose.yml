# Local development stack. Start everything with:  docker compose up --build
name: fitnutro

services:
  frontend:
    build:
      context: ./web/frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      # Used by the browser, so it points at the host port, not the service name
      VITE_API_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true" # file watching through Windows bind mounts
    volumes:
      - ./web/frontend:/app
      - /app/node_modules # keep the container's Linux node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./web/backend
      target: dev
    ports:
      - "4000:4000"
    env_file:
      - path: ./web/backend/.env
        required: false
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: postgresql://fitnutro:fitnutro@db:5432/fitnutro
    volumes:
      - ./web/backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build: ./ai-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./ai-service:/app

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fitnutro
      POSTGRES_PASSWORD: fitnutro
      POSTGRES_DB: fitnutro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnutro -d fitnutro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
